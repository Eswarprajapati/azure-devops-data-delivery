name: Release checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - run: python -m unittest discover -s tests -v
    - run: python data_job.py data/orders.csv demo/revenue.csv
    - run: python tools/build_release.py dist
    - uses: actions/upload-artifact@v4
      with:
        name: data-job
        path: dist/
